name: Build server

on:
  push:
    tags:
      - "**"
  pull_request:
    paths:
      - "server/**"
      - "tools/**"
      - "packaging/**"
      - "tests/**"
      - "channels.txt"
      - ".github/workflows/build-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      # Every platform is built even if one fails. A single failure is a fact
      # about that platform, and cancelling the others would hide whether the
      # same change broke the rest -- which is the question a matrix is for.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
          - os: macos-latest
            label: macOS arm64
          - os: windows-latest
            label: Windows x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # PyInstaller builds for the machine it runs on; there is no cross-build
      # here, which is why this is a matrix rather than one job with flags.
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build
        run: python tools/build_server.py

      # A build that succeeds is not a program that runs. Every failure found
      # while writing this was of that kind: the bundle built cleanly and died
      # on start, because PyInstaller cannot see an import reached only through
      # a name at run time. This starts the executable and checks it serves.
      - name: Smoke test
        run: python tools/smoke_test_package.py build-server

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-${{ matrix.os }}
          path: build-server/*
          if-no-files-found: error

  release:
    # Tag pushes only, and only once every platform has been built. Publishing a
    # release with two of the three downloads in it would look complete and not
    # be.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The firmware workflow publishes to the same release for the same tag, and
    # a release is updated by reading it and writing it back. Two jobs doing that
    # at once lose one side's files. Concurrency groups are repository-wide, so
    # naming the group after the tag makes the two workflows queue behind each
    # other -- and cancel-in-progress must stay false, because cancelling a
    # release job halfway is how a published release ends up missing an asset.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true

      - name: List what will be published
        run: ls -la release/

      # The page a user lands on when they click the release. Without a body it
      # shows a list of filenames and nothing else -- no indication which one is
      # for their computer, or that flashing the device and running the server
      # are two separate things both needed. Written once, in a file both
      # workflows read, so the firmware job and the server job cannot publish
      # different explanations of the same release.
      - name: Create release (tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }}"
          # Inline rather than read from a file. The release job does not check
          # out the repository -- it only downloads the built artifacts -- so a
          # body_path pointed at a file that is not there, and the action
          # reported "Failed to read body_path (ENOENT). Falling back to 'body'
          # input", which is to say it published an empty page. The text is the
          # same in both workflows, and keeping it identical matters: whichever
          # job runs second rewrites the release.
          body: |
            ## 下载哪个文件

            先看你要做什么。

            **给设备刷固件** —— 下载 `FoloToy-AI-Passport-tv.bin`。这是完整镜像，包含引导程序、分区表和应用程序，从地址 0 一次写完。

            **让电脑提供电视信号** —— 按你的系统下载：

            | 你的电脑 | 下载 |
            | --- | --- |
            | Windows | `tv-server-windows-amd64.exe` |
            | Mac（M 系列芯片） | `tv-server-macos-arm64.zip` |
            | Linux | `tv-server-linux-x86_64.zip` |

            Mac 和 Linux 下载的是压缩包，**解压后再运行**。压缩包是为了保住"可执行"这个标记——直接传程序文件的话，那个标记会在下载途中丢掉，双击会被系统拒绝。

            两件事都要做：设备刷固件，电脑跑服务。

            ## 怎么用

            **刷固件**：推荐用网页直接刷，不用装软件 —— <https://zpdeng1020-coder.github.io/ai-passport-tv/flash/>

            手动刷的命令：

            ```
            esptool.py --chip esp32c3 --port <你的串口> write_flash 0x0 FoloToy-AI-Passport-tv.bin
            ```

            > **不要使用 `erase-flash`**，那会擦掉设备里出厂写入的身份信息，擦掉找不回来。

            **跑服务**：把下载的文件放进一个空文件夹，双击。电脑上不需要预先装任何东西——程序第一次运行会自己取回缺的视频转换组件。

            **连设备**：设备第一次开机会显示彩条和一个 `FoloToy-XXXX` 网络名。手机连上它，浏览器打开 `192.168.4.1`，填 WiFi 和屏幕上打印的那个地址。

            完整步骤、按键功能、故障排查见仓库首页的 [README](https://github.com/zpdeng1020-coder/ai-passport-tv#readme)。

            ## 这个版本有什么

            - **画质与流畅度**：320×180 原生 1:1 宽屏点对点，12kB 黄金双包传输，智能边缘滤波与自适应流控
            - **重要提醒**：固件与服务端版本必须保持一致，刷入新固件后请同步下载运行最新版服务端
            - **设备端**：网络电视播放，三个按键完成换台、音量、亮度与选台
            - **配网**：开箱自动进配网；服务器地址可以填主机名，路由器换 IP 之后不受影响
            - **电脑端**：下载一个文件双击即用，不必安装 Python；首次运行自动获取 ffmpeg
            - **频道配置页**：挑选、排序、检测失效；检测区分可用／较慢／失效三态

            ## 常见问题

            **设备显示"连不上服务器"**

            Windows 默认会挡住外面的设备来连。第一次运行时如果弹出防火墙询问，勾上"专用网络"；没弹或点了取消，用管理员 PowerShell 加一条：

            ```powershell
            New-NetFirewallRule -DisplayName "AI Passport TV" -Direction Inbound -Protocol TCP -LocalPort 8096 -Action Allow -Profile Private
            ```

            **Mac 上双击被拦下：「未打开"tv-server-macos-arm64"」**

            不是文件坏了——本项目没有购买代码签名证书，系统认不出来。按这三步走：

            1. 点 **完成**。**不要点「移到废纸篓」**，那是把程序删掉。
            2. 打开 **系统设置 → 隐私与安全性**，往下滑，找到「已阻止"tv-server-macos-arm64"以保护 Mac」。
            3. 点 **仍要打开**，再确认一次。

            **换台要等几秒**

            正常。每换一个台，电脑要重新开始拉流和转换。

            ## 测到什么程度

            如实说明，免得你遇到问题不知道该不该怀疑程序。

            **实际验证过的**：Windows 11 上完整跑通（没装 Python、没装 ffmpeg 的真机器）；macOS 上完整跑通（构建、启动、取流、频道表保存后自动重启）；三个平台的构建由 CI 分别执行，每个平台构建完立刻启动一次做冒烟测试。

            **没有验证的**：Linux 上没有人真的用过（CI 里构建和测试都通过，但那是服务器环境不是桌面）；Intel 芯片的 Mac 没有现成文件，构建机器只有 M 系列芯片。

            **已知会遇到的**：公开的直播源会失效，这是常态不是故障，用配置页的"检测失效"剔掉即可。
          files: release/tv-server-*
          fail_on_unmatched_files: true
